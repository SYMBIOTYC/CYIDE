name: Bug report
about: Create a report to help us improve
title: ''
labels: bug
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill this out so we can investigate.

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: '26.803.61603'
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: '20.x'
    validations:
      required: false

  - type: input
    id: vscode
    attributes:
      label: VS Code version
      placeholder: '1.96.2'
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behavior.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs, especially `/tmp/su-adapter.log` or VS Code logs.
      render: shell
