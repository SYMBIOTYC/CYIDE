# .github/workflows/make-public.yml
name: Make cy.CY public

# Attempts to set the PublishedExtensionFlags.Public (256) bit on cy.CY and
# dumps the authenticated gallery state. Auth uses the publisher PAT (VSCE_PAT),
# which exists as a repo secret. Triggered by push to this branch.
on:
  workflow_dispatch:
  push:
    branches: [make-public]
    paths: [.github/workflows/make-public.yml]

permissions:
  contents: read
  issues: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: make-public

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose + set public
        run: |
          npm install @vscode/vsce >/dev/null 2>&1
          node -e '
          const fs = require("fs");
          const { getGalleryAPI } = require("@vscode/vsce/out/util");
          const { PublishedExtensionFlags } = require("azure-devops-node-api/interfaces/GalleryInterfaces");
          const PUB = "cy", NAME = "CY", Public = PublishedExtensionFlags.Public;
          const out = [];
          async function qdump(api, ft, val, label, acct){
            try {
              const q = await api.queryExtensions(null, {filters:[{criteria:[{filterType:ft,value:val}]}],flags:2119,assetTypes:[]}, acct, acct ? ("Bearer "+acct) : undefined);
              out.push(label + " results=" + (q.results ? q.results.length : "?"));
              for (const r of (q.results||[])) {
                out.push(label + " exts_len=" + (r.extensions ? r.extensions.length : "undef"));
                for (const e of (r.extensions||[])) {
                  out.push(label + " EXT " + JSON.stringify({name:e.extensionName,pub:e.publisher&&e.publisher.publisherName,flags:e.flags,published:e.published,validationResult:e.validationResult,state:e.state,lastUpdated:e.lastUpdated,versions:(e.versions||[]).map(v=>v.version)}));
                }
              }
            } catch(err){ out.push(label + " ERR " + (err.message||err)); }
          }
          (async () => {
            if (!process.env.VSCE_PAT) throw new Error("VSCE_PAT missing");
            const api = await getGalleryAPI(process.env.VSCE_PAT);
            await qdump(api, 7, "cy.CY", "F7");
            await qdump(api, 3, "cy", "F3priv");
            await qdump(api, 7, "cy.CY", "F7acct", "cy");
            await qdump(api, 18, "cy", "F18pub", "cy");
            const res = await api.updateExtensionProperties(PUB, NAME, Public);
            out.push("update res flags=" + (res && res.flags));
            await qdump(api, 7, "cy.CY", "F7after", "cy");
            out.push("RESULT: OK");
          })().catch(e => { out.push("RESULT: FAIL " + (e.message||e)); })
            .finally(() => { fs.writeFileSync("make-public-status.txt", out.join("\n") + "\n"); });
          '
      - name: Report to issue
        if: always()
        run: |
          gh issue create --repo SYMBIOTYC/CYIDE --title "make-public diagnostics" --body-file make-public-status.txt || true
