# .github/workflows/make-public.yml
name: Make cy.CY public

# Sets the PublishedExtensionFlags.Public (256) bit on cy.CY so it becomes
# visible in the public VS Code Marketplace gallery. Auth uses the publisher
# PAT (VSCE_PAT) which exists as a repo secret.
#
# Triggered by push to this branch (no workflow_dispatch API scope needed).
on:
  workflow_dispatch:
  push:
    branches: [make-public]
    paths: [.github/workflows/make-public.yml]

permissions:
  contents: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: make-public

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set extension public
        run: |
          npm install @vscode/vsce >/dev/null 2>&1
          node -e '
          const fs = require("fs");
          const { getGalleryAPI } = require("@vscode/vsce/out/util");
          const { PublishedExtensionFlags } = require("azure-devops-node-api/interfaces/GalleryInterfaces");
          const PUB = "cy", NAME = "CY";
          const Public = PublishedExtensionFlags.Public;       // 256
          const Unpublished = PublishedExtensionFlags.Unpublished; // 4096
          const out = [];
          function qdump(api){
            return api.queryExtensions(null, {filters:[{criteria:[{filterType:7,value:"cy.CY"}]}],flags:2151,assetTypes:[]}, undefined, undefined)
              .then(q => {
                out.push("AUTH QUERY results=" + q.results.length);
                for (const r of q.results) for (const e of (r.extensions||[])) {
                  out.push("EXT " + JSON.stringify({name:e.extensionName,pub:e.publisher&&e.publisher.publisherName,flags:e.flags,published:e.published,validationResult:e.validationResult,state:e.state,lastUpdated:e.lastUpdated,versions:(e.versions||[]).map(v=>v.version)}));
                }
              });
          }
          (async () => {
            if (!process.env.VSCE_PAT) throw new Error("VSCE_PAT missing");
            const api = await getGalleryAPI(process.env.VSCE_PAT);
            await qdump(api);
            const res = await api.updateExtensionProperties(PUB, NAME, Public);
            out.push("update res flags=" + (res && res.flags));
            await qdump(api);
            out.push("RESULT: OK");
          })().catch(e => { out.push("RESULT: FAIL " + (e.message||e)); })
            .finally(() => { fs.writeFileSync("make-public-status.txt", out.join("\n") + "\n"); });
          '

      - name: Commit status
        run: |
          git config user.name "cyide-bot"
          git config user.email "cyide-bot@users.noreply.github.com"
          git add make-public-status.txt
          git commit -m "make-public status [skip ci]" || echo "nothing to commit"
          git push origin make-public || echo "push failed"
