# .github/workflows/release.yml
name: Release CYIDE Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 1.2.3. Leave empty to auto-bump patch."
        required: false
        default: ""

# NOTE: `main` is branch-protected (enforce_admins: true), so this workflow
# never pushes directly to it. Instead it bumps the version on a dedicated
# release branch, pushes that branch, opens a PR to main, and publishes the
# release from the release branch via the GitHub API.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
       - name: Cache npm dependencies
         uses: actions/cache@v4
         with:
           path: ~/.npm
           key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
           restore-keys: npm-${{ runner.os }}-

      - name: Configure git
        run: |
          git config user.name  "cyide-bot"
          git config user.email "cyide-bot@users.noreply.github.com"

      - name: Bump version & package VSIX
        id: pkg
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            bash ./release.sh "${{ github.event.inputs.version }}"
          else
            bash ./release.sh
          fi
          VER=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Commit, push release branch & open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.pkg.outputs.version }}"
          BRANCH="release/v$VER"
          # Never touch protected `main`; work on a release branch instead.
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore(release): v$VER [skip ci]"
          git tag "v$VER"
          git push origin "$BRANCH" --tags
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release v$VER" \
            --body "Automated release **v$VER**." \
            || echo "PR already exists or could not be created."

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: CY-${{ steps.pkg.outputs.version }}.vsix
          path: CY-*.vsix
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: CY IDE v${{ steps.pkg.outputs.version }}
          target_commitish: release/v${{ steps.pkg.outputs.version }}
          files: CY-*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --allow-all-proposed-apis --packagePath "CY-${{ steps.pkg.outputs.version }}.vsix" --pat "$VSCE_PAT"
