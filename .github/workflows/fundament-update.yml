name: Fundament Update
on:
  schedule:
    - cron: 0 2 * * *
  workflow_dispatch:






permissions:
  contents: write
  pull-requests: write






jobs:
  update-fundament:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: "git config user.name \"cyide-bot\"\ngit config user.email \"cyide-bot@users.noreply.github.com\"\
          \n"
      - name: Run fundament update
        env:
          SU_CODEX_VSIX_URL: ${{ vars.SU_CODEX_VSIX_URL }}
        run: bash scripts/update-fundament.sh
      - name: Detect changes
        id: changes
        run: "if [ -z \"$(git status --porcelain)\" ]; then\n  echo \"changed=false\"\
          \ >> \"$GITHUB_OUTPUT\"\n  echo \"No fundament changes detected.\"\nelse\n\
          \  echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      - name: Open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "git config http.postBuffer 524288000\nBRANCH=\"fundament/$(date +%Y%m%d-%H%M%S)\"\
          \ngit checkout -b \"$BRANCH\"\ngit add out/extension.js webview package.json
          UPSTREAM_VERSION\nUP=$(cat UPSTREAM_VERSION 2>/dev/null || echo unknown)\n\
          LOCAL=$(node -e \"console.log(require('./package.json').version)\")\ngit
          commit -m \"chore(fundament): sync to openai.chatgpt $UP (cy.su $LOCAL)\"\
          \nfor i in 1 2 3; do\n  git push origin \"$BRANCH\" && break\n  echo \"\
          push attempt $i failed, retrying...\"; sleep 5\ndone\ngh pr create \\\n\
          \  --title \"Fundament update → openai.chatgpt $UP\" \\\n  --body \"Automated
          sync of the openai.chatgpt fundament into cy.su.\n\n  - Upstream version:
          **$UP**\n  - Local version: **$LOCAL**\n  - Rebranded extension.js + webview,
          portable cliExecutable, built VSIX.\n\n  Validate activation before merging.\"\
          \ \\\n  --label fundament-update\n"
      - name: Upload VSIX artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: su-vsix
          path: su-*.vsix
          if-no-files-found: warn
